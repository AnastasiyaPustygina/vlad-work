<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Улучшение персонажа</title>
    <link rel="stylesheet" href="css/character-upgrade.css">
    <link rel="stylesheet" href="css/finance.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="top-nav">
    <a href="character.html" class="nav-item">
        <i class="fas fa-user"></i>
        <span>Профиль</span>
    </a>
    <a href="finance.html" class="nav-item">
        <i class="fas fa-coins"></i>
        <span>Финансы</span>
    </a>
    <a href="books.html" class="nav-item">
        <i class="fas fa-book"></i>
        <span>Книги</span>
    </a>
    <a href="character-upgrade.html" class="nav-item active">
        <i class="fas fa-chart-line"></i>
        <span>Характеристики</span>
    </a>
    <a href="life.html" class="nav-item">
        <i class="fas fa-heart"></i>
        <span>Жизнь</span>
    </a>
</div>
<div class="container">
    <h1>Улучшение персонажа</h1>

    <div class="character-info">
        <img id="characterImage" src="" alt="Avatar">
        <h2 id="characterName">Имя</h2>
        <p>Возраст: <span id="characterAge"></span></p>
        <p>Пол: <span id="characterGender"></span></p>
    </div>

    <div class="upgrade-section">
        <label>Профессия:</label>
        <select id="jobSelect"></select>

        <label>Образование:</label>
        <select id="educationSelect"></select>

        <label>Жильё:</label>
        <select id="livingSelect"></select>

        <label>Транспорт:</label>
        <select id="transportSelect"></select>
        <div id="upgradeCost" style="margin-top: 1rem; font-weight: bold; color: #ffffff;">
            Стоимость улучшений: 0 монет
        </div>
        <button id="saveUpgrades">Сохранить изменения</button>
    </div>
</div>
<div class="bottom-nav">
    <div class="bottom-item">
        <i class="fas fa-calendar-week"></i>
        <span id="current-week">Неделя 1</span>
    </div>
    <div class="bottom-item">
        <i class="fas fa-clock"></i>
        <span id="game-time">День 1, 08:00</span>
    </div>
    <div class="bottom-item">
        <i class="fas fa-wallet"></i>
        <span class="money-display" id="current-money">0 ₽</span>
    </div>
</div>
<script src="js/character-upgrade.js"></script>
</body>
</html>
